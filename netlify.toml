# Netlify configuration for Nuxt 3 project
[build]
  command = "npm run generate"
  publish = "dist"
  functions = ".netlify/functions"

[dev]
  command = "npm run dev"
  port = 3000

[[redirects]]
  from = "/api/*"
  to = "https://fidel-of6u.onrender.com/api/:splat"
  status = 200

